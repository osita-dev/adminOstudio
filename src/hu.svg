<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carton — Packaging Study No. 03</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(120% 90% at 50% 0%, #2c2115 0%, #1a1309 55%, #120c06 100%);
    display:flex;align-items:center;justify-content:center;
    padding:clamp(18px,4vw,56px);
    font-family:'DM Mono',ui-monospace,monospace;
  }
  .stage{width:min(94vw,880px)}
  .plate{
    position:relative;
    filter:drop-shadow(0 34px 64px rgba(0,0,0,.58));
    animation:rise 1.05s cubic-bezier(.2,.75,.25,1) both;
  }
  .plate svg{display:block;width:100%;height:auto}
  @keyframes rise{
    from{opacity:0;transform:translateY(28px) scale(.985)}
    to{opacity:1;transform:none}
  }
  @media (prefers-reduced-motion:reduce){.plate{animation:none}}
</style>
</head>
<body>

<main class="stage">
  <figure class="plate">
    <svg viewBox="0 0 800 800" role="img" aria-labelledby="ttl desc">
      <title id="ttl">The Carton — a kraft cardboard carton study</title>
      <desc id="desc">Illustration of a kraft corrugated shipping carton wrapped in packing tape, with a shipping label, a this-side-up stencil and a fragile stamp, set on a warm dark backdrop.</desc>

      <defs>
        <linearGradient id="gTop" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#C4935F"/>
          <stop offset=".55" stop-color="#DDAF7D"/>
          <stop offset="1" stop-color="#CFA06C"/>
        </linearGradient>
        <linearGradient id="gFront" x1="0" y1="0" x2=".25" y2="1">
          <stop offset="0" stop-color="#C59360"/>
          <stop offset="1" stop-color="#A67848"/>
        </linearGradient>
        <linearGradient id="gRight" x1="0" y1="0" x2=".3" y2="1">
          <stop offset="0" stop-color="#926539"/>
          <stop offset="1" stop-color="#734B2B"/>
        </linearGradient>
        <linearGradient id="gTape" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F2E0BC" stop-opacity=".96"/>
          <stop offset=".5" stop-color="#E3CC9F" stop-opacity=".9"/>
          <stop offset="1" stop-color="#D4B98A" stop-opacity=".93"/>
        </linearGradient>
        <linearGradient id="gPaper" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F8F1E0"/>
          <stop offset="1" stop-color="#E6D7BA"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.42" cy="0.24" r="0.8">
          <stop offset="0" stop-color="#6E5439" stop-opacity=".9"/>
          <stop offset=".5" stop-color="#3D2D1E" stop-opacity=".38"/>
          <stop offset="1" stop-color="#241A11" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vig" cx="0.5" cy="0.44" r="0.74">
          <stop offset=".5" stop-color="#000000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000000" stop-opacity=".58"/>
        </radialGradient>

        <pattern id="flute" width="7" height="7" patternUnits="userSpaceOnUse">
          <path d="M0 3.5 q1.75 -2.7 3.5 0 q1.75 2.7 3.5 0" fill="none" stroke="#6B4526" stroke-width="1.1" stroke-opacity=".55"/>
        </pattern>

        <filter id="soft" x="-45%" y="-160%" width="190%" height="420%">
          <feGaussianBlur stdDeviation="17"/>
        </filter>
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
        </filter>
      </defs>

      <!-- backdrop -->
      <rect width="800" height="800" fill="#221910"/>
      <rect width="800" height="800" fill="url(#glow)"/>
      <rect width="800" height="800" fill="url(#vig)"/>

      <!-- contact shadow -->
      <ellipse cx="403" cy="652" rx="288" ry="32" fill="#100A04" opacity=".7" filter="url(#soft)"/>
      <ellipse cx="392" cy="644" rx="186" ry="17" fill="#0A0602" opacity=".6" filter="url(#soft)"/>

      <!-- ============ CARTON ============ -->
      <g transform="translate(-89.5,-30.75) scale(1.35)">

        <!-- faces -->
        <path d="M170 230 L390 300 L560 215 L340 145 Z" fill="url(#gTop)"/>
        <path d="M170 230 L390 300 L390 500 L170 430 Z" fill="url(#gFront)"/>
        <path d="M390 300 L560 215 L560 415 L390 500 Z" fill="url(#gRight)"/>

        <!-- edges / rim light -->
        <path d="M170 230 L390 300 L560 215" fill="none" stroke="#EBC196" stroke-opacity=".5" stroke-width="1.7"/>
        <path d="M390 300 L390 500" fill="none" stroke="#7E5330" stroke-opacity=".55" stroke-width="1.5"/>
        <path d="M170 230 L170 430" fill="none" stroke="#D9A972" stroke-opacity=".28" stroke-width="1.4"/>
        <path d="M560 215 L560 415" fill="none" stroke="#B98košt" stroke-opacity="0" stroke-width="1"/>
        <path d="M560 215 L560 415" fill="none" stroke="#B27F4D" stroke-opacity=".3" stroke-width="1.5"/>
        <path d="M170 430 L390 500 L560 415" fill="none" stroke="#6B4526" stroke-opacity=".35" stroke-width="1.3"/>

        <!-- corrugated fluting at cut edges -->
        <g>
          <rect x="0" y="188" width="220" height="12" fill="url(#flute)" transform="translate(170,230) skewY(17.65)" opacity=".85"/>
          <rect x="0" y="188" width="170" height="12" fill="url(#flute)" transform="translate(390,300) skewY(-26.57)" opacity=".85"/>
        </g>

        <!-- packing tape -->
        <g>
          <path d="M313.6 275.7 L346.4 286.1 L516.4 201.1 L483.6 190.7 Z" fill="url(#gTape)"/>
          <path d="M313.6 275.7 L346.4 286.1 L346.4 486.1 L313.6 475.7 Z" fill="url(#gTape)"/>
          <path d="M313.6 275.7 L483.6 190.7" fill="none" stroke="#FBF0D8" stroke-opacity=".45" stroke-width="1.1"/>
          <path d="M313.6 275.7 L313.6 475.7" fill="none" stroke="#FBF0D8" stroke-opacity=".4" stroke-width="1.1"/>
          <path d="M346.4 286.1 L346.4 486.1" fill="none" stroke="#9C7C4E" stroke-opacity=".35" stroke-width="1.1"/>
          <path d="M330 281 L330 481" fill="none" stroke="#FFF6E2" stroke-opacity=".22" stroke-width="2"/>
        </g>

        <!-- stencil: this side up (front face) -->
        <g transform="translate(170,230) skewY(17.65)" opacity=".8">
          <rect x="16" y="12" width="118" height="32" fill="none" stroke="#A9462F" stroke-width="2"/>
          <path d="M28 37 L28 25 M23.5 28.5 L28 22.5 L32.5 28.5" fill="none" stroke="#A9462F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M42 37 L42 25 M37.5 28.5 L42 22.5 L46.5 28.5" fill="none" stroke="#A9462F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="54" y="33" font-family="'DM Mono',monospace" font-size="8.6" letter-spacing="1" fill="#A9462F">THIS SIDE UP</text>
        </g>

        <!-- shipping label (front face) -->
        <g transform="translate(170,230) skewY(17.65)">
          <rect x="20.5" y="61" width="126" height="116" fill="#4E3018" opacity=".3"/>
          <rect x="18" y="58" width="126" height="116" fill="url(#gPaper)" stroke="#C9B18B" stroke-width="1"/>
          <rect x="18" y="58" width="126" height="21" fill="#2B211A"/>
          <text x="26" y="72.5" font-family="'DM Mono',monospace" font-size="9.2" letter-spacing="2.2" fill="#EFE3CB">SHIP TO</text>
          <rect x="118" y="62" width="18" height="12" fill="#B4402A"/>
          <text x="127" y="71.2" text-anchor="middle" font-family="'DM Mono',monospace" font-size="7.2" letter-spacing=".4" fill="#F6E9CF">EXP</text>

          <text x="26" y="99" font-family="'DM Mono',monospace" font-size="11.4" letter-spacing=".4" fill="#2B211A">M. ARROYO</text>
          <text x="26" y="113" font-family="'DM Mono',monospace" font-size="8.2" letter-spacing=".3" fill="#6C5B47">128 CANAL STREET</text>
          <text x="26" y="124" font-family="'DM Mono',monospace" font-size="8.2" letter-spacing=".3" fill="#6C5B47">PORTLAND, OR 97209</text>
          <line x1="26" y1="131" x2="136" y2="131" stroke="#D3BF9B" stroke-width="1"/>

          <g fill="#2B211A">
            <rect x="26" y="136" width="3" height="22"/><rect x="31" y="136" width="1" height="22"/>
            <rect x="35" y="136" width="2" height="22"/><rect x="39" y="136" width="4" height="22"/>
            <rect x="45" y="136" width="1" height="22"/><rect x="49" y="136" width="2" height="22"/>
            <rect x="53" y="136" width="3" height="22"/><rect x="58" y="136" width="1" height="22"/>
            <rect x="63" y="136" width="2" height="22"/><rect x="67" y="136" width="5" height="22"/>
            <rect x="75" y="136" width="1" height="22"/><rect x="78" y="136" width="2" height="22"/>
            <rect x="83" y="136" width="3" height="22"/><rect x="88" y="136" width="1" height="22"/>
            <rect x="91" y="136" width="4" height="22"/><rect x="98" y="136" width="2" height="22"/>
            <rect x="102" y="136" width="1" height="22"/><rect x="106" y="136" width="3" height="22"/>
            <rect x="111" y="136" width="2" height="22"/><rect x="117" y="136" width="4" height="22"/>
            <rect x="123" y="136" width="1" height="22"/><rect x="126" y="136" width="3" height="22"/>
            <rect x="131" y="136" width="2" height="22"/>
          </g>
          <text x="26" y="169" font-family="'DM Mono',monospace" font-size="7.4" letter-spacing="1.1" fill="#6C5B47">0 421 889 07</text>
        </g>

        <!-- fragile stamp (right face) -->
        <g transform="translate(390,300) skewY(-26.57)" opacity=".82">
          <g transform="rotate(-5 85 70)">
            <rect x="22" y="40" width="126" height="58" fill="none" stroke="#B0472F" stroke-width="3"/>
            <rect x="28" y="46" width="114" height="46" fill="none" stroke="#B0472F" stroke-width="1"/>
            <text x="85" y="78" text-anchor="middle" font-family="'Fraunces',Georgia,serif" font-weight="600" font-size="22" letter-spacing="1.5" fill="#B0472F">FRAGILE</text>
          </g>
          <g fill="none" stroke="#B0472F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M72 168 L72 130 M63.5 138 L72 127.5 L80.5 138"/>
            <path d="M100 168 L100 130 M91.5 138 L100 127.5 L108.5 138"/>
          </g>
        </g>
      </g>

      <!-- grain -->
      <rect width="800" height="800" filter="url(#grain)" opacity=".13" style="mix-blend-mode:overlay"/>

      <!-- frame + typography -->
      <rect x="26" y="26" width="748" height="748" fill="none" stroke="#F0E4CE" stroke-opacity=".13"/>

      <text x="52" y="72" font-family="'DM Mono',monospace" font-size="11" letter-spacing="3.6" fill="#C2A67F">OBJECT NO. 03</text>
      <text x="52" y="94" font-family="'DM Mono',monospace" font-size="10" letter-spacing="2.2" fill="#8E7457">KRAFT BOARD · SINGLE WALL · 32 ECT</text>

      <text x="748" y="72" text-anchor="end" font-family="'DM Mono',monospace" font-size="11" letter-spacing="3.6" fill="#C2A67F">PACKAGING STUDY</text>
      <text x="748" y="94" text-anchor="end" font-family="'DM Mono',monospace" font-size="10" letter-spacing="2.2" fill="#8E7457">PLATE 01 / SCALE 1:1</text>

      <text x="52" y="764" font-family="'Fraunces',Georgia,serif" font-style="italic" font-weight="300" font-size="116" fill="#F2E7D2">Carton</text>

      <line x1="430" y1="712" x2="748" y2="712" stroke="#F0E4CE" stroke-opacity=".18"/>
      <text x="430" y="738" font-family="'DM Mono',monospace" font-size="10.5" letter-spacing="2" fill="#AC9271">SHIPPED FLAT · ASSEMBLED BY HAND</text>
      <text x="430" y="760" font-family="'DM Mono',monospace" font-size="10.5" letter-spacing="2" fill="#8B7255">RECYCLED FIBRE · 100% PAPER</text>
    </svg>
  </figure>
</main>

</body>
</html>